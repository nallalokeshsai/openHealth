<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 450 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .device-frame { fill: #000000; stroke: #333; stroke-width: 2; }
      .header-bg { fill: #1C1C1E; }
      .card-bg { fill: #1C1C1E; stroke: #545458; stroke-width: 0.5; }
      .tab-bar { fill: #0E0E10; stroke: #545458; stroke-width: 0.5; }
      .accent { fill: #A3E635; }
      .text-header { font-size: 28px; font-weight: bold; fill: #FFFFFF; font-family: system-ui; }
      .text-label { font-size: 11px; fill: rgba(235,235,245,0.60); font-family: system-ui; }
      .text-body { font-size: 12px; fill: #FFFFFF; font-family: system-ui; }
      .text-value { font-size: 14px; font-weight: bold; fill: #FFFFFF; font-family: system-ui; }
      .text-accent { font-size: 12px; font-weight: bold; fill: #A3E635; font-family: system-ui; }
      .text-gold { font-size: 12px; font-weight: bold; fill: #FFB84D; font-family: system-ui; }
      .separator { stroke: rgba(84,84,88,0.60); stroke-width: 0.5; }
    </style>
  </defs>

  <rect class="device-frame" x="20" y="20" width="410" height="960" rx="20"/>
  
  <!-- HEADER -->
  <rect class="header-bg" x="20" y="60" width="410" height="52"/>
  <text class="text-header" x="35" y="90">Body</text>
  <text class="text-label" x="35" y="105">Your measurements & vitals</text>
  <circle fill="#A3E635" cx="410" cy="85" r="12"/>
  <text class="text-body" x="405" y="90" text-anchor="middle">⚙️</text>

  <!-- WEIGHT TREND CARD -->
  <rect class="card-bg" x="30" y="118" width="390" height="120" rx="8"/>
  <text class="text-value" x="225" y="160" text-anchor="middle" font-size="32">75.2 kg</text>
  <text class="text-label" x="225" y="180" text-anchor="middle">+1.1 kg this week</text>
  <text class="text-gold" x="225" y="180" text-anchor="middle" x="280" y="180">+1.1 kg</text>
  <text class="text-label" x="340" y="180" text-anchor="middle">Goal: 73 kg</text>
  
  <!-- Sparkline -->
  <rect fill="#2C2C2E" x="50" y="192" width="390" height="30" rx="4"/>
  <polyline points="60,210 75,205 90,208 105,200 120,206 135,198 150,204 165,195 180,202 195,197 210,205 225,196 240,203 245,195 250,210" stroke="#A3E635" stroke-width="1.5" fill="none"/>
  <text class="text-label" x="225" y="228" text-anchor="middle">30-day trend chart</text>

  <!-- MEASUREMENTS CARD -->
  <rect class="card-bg" x="30" y="254" width="390" height="180" rx="8"/>
  <text class="text-body" x="50" y="274">Measurements</text>
  <line class="separator" x1="50" y1="284" x2="410" y2="284"/>
  
  <text class="text-body" x="225" y="310" text-anchor="middle" font-size="40">👤</text>
  
  <!-- Measurement rows -->
  <text class="text-body" x="50" y="338">Neck</text>
  <text class="text-value" x="390" y="338" text-anchor="end">37.5 cm</text>
  
  <line class="separator" x1="50" y1="346" x2="410" y2="346"/>
  <text class="text-body" x="50" y="368">Waist</text>
  <text class="text-value" x="390" y="368" text-anchor="end">78.2 cm</text>
  
  <line class="separator" x1="50" y1="376" x2="410" y2="376"/>
  <text class="text-body" x="50" y="398">Hip</text>
  <text class="text-value" x="390" y="398" text-anchor="end">92.1 cm</text>
  
  <line class="separator" x1="50" y1="406" x2="410" y2="406"/>
  <text class="text-body" x="50" y="428">Chest</text>
  <text class="text-value" x="390" y="428" text-anchor="end">98.4 cm</text>

  <!-- COMPOSITION CARD -->
  <rect class="card-bg" x="30" y="450" width="390" height="88" rx="8"/>
  <text class="text-body" x="50" y="470">Composition</text>
  <line class="separator" x1="50" y1="480" x2="410" y2="480"/>
  
  <rect fill="#2C2C2E" x="50" y="492" width="85" height="38" rx="6"/>
  <text class="text-label" x="92.5" y="502" text-anchor="middle">Body fat</text>
  <text class="text-value" x="92.5" y="522" text-anchor="middle" font-size="18">16.2%</text>
  
  <rect fill="#2C2C2E" x="145" y="492" width="85" height="38" rx="6"/>
  <text class="text-label" x="187.5" y="502" text-anchor="middle">Lean mass</text>
  <text class="text-value" x="187.5" y="522" text-anchor="middle" font-size="18">63.1 kg</text>
  
  <rect fill="#2C2C2E" x="240" y="492" width="85" height="38" rx="6"/>
  <text class="text-label" x="282.5" y="502" text-anchor="middle">Muscle</text>
  <text class="text-value" x="282.5" y="522" text-anchor="middle" font-size="18">58 kg</text>
  
  <rect fill="#2C2C2E" x="335" y="492" width="85" height="38" rx="6"/>
  <text class="text-label" x="377.5" y="502" text-anchor="middle">Water</text>
  <text class="text-value" x="377.5" y="522" text-anchor="middle" font-size="18">42%</text>

  <!-- VITALS CARD -->
  <rect class="card-bg" x="30" y="554" width="390" height="104" rx="8"/>
  <text class="text-body" x="50" y="574">Latest vitals</text>
  <line class="separator" x1="50" y1="584" x2="410" y2="584"/>
  
  <text class="text-body" x="50" y="606">Heart rate</text>
  <text class="text-value" x="390" y="606" text-anchor="end">62 bpm</text>
  <text class="text-body" x="405" y="606" text-anchor="end">›</text>
  
  <line class="separator" x1="50" y1="614" x2="410" y2="614"/>
  <text class="text-body" x="50" y="636">Blood pressure</text>
  <text class="text-value" x="390" y="636" text-anchor="end">118/76 mmHg</text>
  <text class="text-body" x="405" y="636" text-anchor="end">›</text>
  
  <line class="separator" x1="50" y1="644" x2="410" y2="644"/>
  <text class="text-body" x="50" y="666">Temperature</text>
  <text class="text-value" x="390" y="666" text-anchor="end">36.8 °C</text>

  <!-- TAB BAR -->
  <rect class="tab-bar" x="20" y="900" width="410" height="80"/>
  <line class="separator" x1="20" y1="900" x2="430" y2="900"/>
  
  <text class="text-label" x="60" y="925" text-anchor="middle">📅</text>
  <text class="text-label" x="60" y="945" text-anchor="middle" font-size="10">Today</text>
  
  <text class="text-label" x="130" y="925" text-anchor="middle">🏋️</text>
  <text class="text-label" x="130" y="945" text-anchor="middle" font-size="10">Train</text>
  
  <text class="text-label" x="200" y="925" text-anchor="middle">🍽️</text>
  <text class="text-label" x="200" y="945" text-anchor="middle" font-size="10">Food</text>
  
  <text class="text-accent" x="270" y="925" text-anchor="middle">👤</text>
  <text class="text-accent" x="270" y="945" text-anchor="middle" font-size="10">Body</text>
  
  <text class="text-label" x="340" y="925" text-anchor="middle">📊</text>
  <text class="text-label" x="340" y="945" text-anchor="middle" font-size="10">Insights</text>
  
  <text class="text-label" x="410" y="925" text-anchor="middle">⋯</text>
  <text class="text-label" x="410" y="945" text-anchor="middle" font-size="10">More</text>

  <rect x="20" y="980" width="410" height="20" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
</svg>