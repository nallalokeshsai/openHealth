<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 450 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .device-frame { fill: #000000; stroke: #333; stroke-width: 2; }
      .header-bg { fill: #1C1C1E; }
      .card-bg { fill: #1C1C1E; stroke: #545458; stroke-width: 0.5; }
      .tab-bar { fill: #0E0E10; stroke: #545458; stroke-width: 0.5; }
      .accent { fill: #A3E635; }
      .red { fill: #FF453A; }
      .text-header { font-size: 28px; font-weight: bold; fill: #FFFFFF; font-family: system-ui; }
      .text-label { font-size: 11px; fill: rgba(235,235,245,0.60); font-family: system-ui; }
      .text-label-3 { font-size: 10px; fill: rgba(235,235,245,0.32); font-family: system-ui; text-transform: uppercase; }
      .text-body { font-size: 12px; fill: #FFFFFF; font-family: system-ui; }
      .text-value { font-size: 14px; font-weight: bold; fill: #FFFFFF; font-family: system-ui; }
      .text-accent { font-size: 12px; font-weight: bold; fill: #A3E635; font-family: system-ui; }
      .separator { stroke: rgba(84,84,88,0.60); stroke-width: 0.5; }
    </style>
  </defs>

  <rect class="device-frame" x="20" y="20" width="410" height="960" rx="20"/>
  
  <!-- HEADER -->
  <rect class="header-bg" x="20" y="60" width="410" height="52"/>
  <text class="text-header" x="35" y="90">More</text>
  <text class="text-label" x="35" y="105">Settings & profile</text>
  <circle fill="#A3E635" cx="410" cy="85" r="12"/>
  <text class="text-body" x="405" y="90" text-anchor="middle">⚙️</text>

  <!-- PROFILE CARD -->
  <rect class="card-bg" x="30" y="118" width="390" height="68" rx="8"/>
  <circle class="accent" cx="60" cy="152" r="20"/>
  <text class="text-body" x="60" y="157" text-anchor="middle" font-size="20">👤</text>
  <text class="text-body" x="100" y="145">Alex Johnson</text>
  <text class="text-label" x="100" y="160">Goal: 73 kg</text>
  <text class="text-body" x="405" y="152" text-anchor="middle">›</text>

  <!-- MODULES SECTION HEADER -->
  <text class="text-label-3" x="35" y="210">Modules</text>

  <!-- MODULES CARD -->
  <rect class="card-bg" x="30" y="216" width="390" height="128" rx="8"/>
  
  <rect fill="#2C2C2E" x="50" y="228" width="32" height="32" rx="6"/>
  <text class="text-body" x="66" y="250" text-anchor="middle">🏋️</text>
  <text class="text-body" x="100" y="250">Training</text>
  <text class="text-accent" x="390" y="250" text-anchor="end">✓</text>
  <line class="separator" x1="50" y1="258" x2="410" y2="258"/>
  
  <rect fill="#2C2C2E" x="50" y="270" width="32" height="32" rx="6"/>
  <text class="text-body" x="66" y="292" text-anchor="middle">🍽️</text>
  <text class="text-body" x="100" y="292">Nutrition</text>
  <text class="text-accent" x="390" y="292" text-anchor="end">✓</text>
  <line class="separator" x1="50" y1="300" x2="410" y2="300"/>
  
  <rect fill="#2C2C2E" x="50" y="312" width="32" height="32" rx="6"/>
  <text class="text-body" x="66" y="334" text-anchor="middle">❤️</text>
  <text class="text-body" x="100" y="334">Vitals</text>
  <text class="text-accent" x="390" y="334" text-anchor="end">✓</text>
  <line class="separator" x1="50" y1="342" x2="410" y2="342"/>
  
  <rect fill="#2C2C2E" x="50" y="354" width="32" height="32" rx="6"/>
  <text class="text-body" x="66" y="376" text-anchor="middle">😴</text>
  <text class="text-body" x="100" y="376">Sleep</text>
  <text class="text-label" x="390" y="376" text-anchor="end" font-size="12">○</text>

  <!-- DEVICES SECTION HEADER -->
  <text class="text-label-3" x="35" y="412">Devices & Integrations</text>

  <!-- DEVICES CARD -->
  <rect class="card-bg" x="30" y="418" width="390" height="88" rx="8"/>
  
  <rect fill="#2C2C2E" x="50" y="430" width="32" height="32" rx="6"/>
  <text class="text-body" x="66" y="452" text-anchor="middle">📱</text>
  <text class="text-body" x="100" y="448">Galaxy Watch 7</text>
  <text class="text-label" x="100" y="463" font-size="10">Connected · Last sync 2m ago</text>
  <text class="text-body" x="405" y="452" text-anchor="middle">›</text>
  <line class="separator" x1="50" y1="470" x2="410" y2="470"/>
  
  <rect fill="#2C2C2E" x="50" y="482" width="32" height="32" rx="6"/>
  <text class="text-body" x="66" y="504" text-anchor="middle">⌚</text>
  <text class="text-body" x="100" y="500">Oura Ring</text>
  <text class="text-label" x="100" y="515" font-size="10">Connected · Last sync 1h ago</text>
  <text class="text-body" x="405" y="504" text-anchor="middle">›</text>

  <!-- DATA SECTION HEADER -->
  <text class="text-label-3" x="35" y="540">Data & Backups</text>

  <!-- DATA CARD -->
  <rect class="card-bg" x="30" y="546" width="390" height="88" rx="8"/>
  
  <rect fill="#2C2C2E" x="50" y="558" width="32" height="32" rx="6"/>
  <text class="text-body" x="66" y="580" text-anchor="middle">☁️</text>
  <text class="text-body" x="100" y="576">Backups</text>
  <text class="text-label" x="100" y="591" font-size="10">Last backup 1h ago</text>
  <text class="text-body" x="405" y="580" text-anchor="middle">›</text>
  <line class="separator" x1="50" y1="598" x2="410" y2="598"/>
  
  <rect fill="#2C2C2E" x="50" y="610" width="32" height="32" rx="6"/>
  <text class="text-body" x="66" y="632" text-anchor="middle">📋</text>
  <text class="text-body" x="100" y="628">Data review</text>
  <text class="text-label" x="100" y="643" font-size="10">0 items pending</text>
  <text class="text-body" x="405" y="632" text-anchor="middle">›</text>

  <!-- APPEARANCE SECTION HEADER -->
  <text class="text-label-3" x="35" y="668">Appearance</text>

  <!-- APPEARANCE CARD -->
  <rect class="card-bg" x="30" y="674" width="390" height="88" rx="8"/>
  
  <rect fill="#2C2C2E" x="50" y="686" width="32" height="32" rx="6"/>
  <text class="text-body" x="66" y="708" text-anchor="middle">🎨</text>
  <text class="text-body" x="100" y="704">Accent colour</text>
  <circle class="accent" cx="390" cy="702" r="8"/>
  <text class="text-label" x="375" y="706" text-anchor="end" font-size="10">Lime</text>
  <text class="text-body" x="405" y="704" text-anchor="end">›</text>
  <line class="separator" x1="50" y1="722" x2="410" y2="722"/>
  
  <rect fill="#2C2C2E" x="50" y="734" width="32" height="32" rx="6"/>
  <text class="text-body" x="66" y="756" text-anchor="middle">🌙</text>
  <text class="text-body" x="100" y="752">Theme</text>
  <text class="text-label" x="390" y="752" text-anchor="end" font-size="11">Dark</text>
  <text class="text-body" x="405" y="752" text-anchor="end">›</text>

  <!-- DELETE SECTION (22dp spacing above) -->
  <text class="text-label-3" x="35" y="828">Destructive</text>

  <!-- DELETE CARD -->
  <rect fill="rgba(255,69,58,0.1)" x="30" y="834" width="390" height="52" rx="8" stroke="rgba(255,69,58,0.3)" stroke-width="0.5"/>
  
  <rect fill="#2C2C2E" x="50" y="846" width="32" height="32" rx="6"/>
  <text class="text-body" x="66" y="868" text-anchor="middle">🗑️</text>
  <text class="red" x="100" y="868" font-weight="bold">Delete all data</text>
  <text class="text-body" x="405" y="868" text-anchor="end">✓</text>

  <!-- TAB BAR -->
  <rect class="tab-bar" x="20" y="900" width="410" height="80"/>
  <line class="separator" x1="20" y1="900" x2="430" y2="900"/>
  
  <text class="text-label" x="60" y="925" text-anchor="middle">📅</text>
  <text class="text-label" x="60" y="945" text-anchor="middle" font-size="10">Today</text>
  
  <text class="text-label" x="130" y="925" text-anchor="middle">🏋️</text>
  <text class="text-label" x="130" y="945" text-anchor="middle" font-size="10">Train</text>
  
  <text class="text-label" x="200" y="925" text-anchor="middle">🍽️</text>
  <text class="text-label" x="200" y="945" text-anchor="middle" font-size="10">Food</text>
  
  <text class="text-label" x="270" y="925" text-anchor="middle">👤</text>
  <text class="text-label" x="270" y="945" text-anchor="middle" font-size="10">Body</text>
  
  <text class="text-label" x="340" y="925" text-anchor="middle">📊</text>
  <text class="text-label" x="340" y="945" text-anchor="middle" font-size="10">Insights</text>
  
  <text class="text-accent" x="410" y="925" text-anchor="middle">⋯</text>
  <text class="text-accent" x="410" y="945" text-anchor="middle" font-size="10">More</text>

  <rect x="20" y="980" width="410" height="20" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
</svg>