# Build and verify openHealth. Written in B0 and never pushed from an agent session.
name: build

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # compileSdk 37 with minor level 2, matching docs/adr/0003-pinned-versions.md.
      - name: Install the pinned SDK platform
        run: sdkmanager "platforms;android-37.2" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The wrapper bit is committed executable, but a checkout on a filesystem that drops the
      # mode would otherwise fail here before Gradle runs.
      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Check
        run: ./gradlew check --no-daemon --console=plain

      - name: Assemble the debug app
        run: ./gradlew :app-android:assembleDebug --no-daemon --console=plain
