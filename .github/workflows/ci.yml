name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Branch protection requires a status named `check`, so the job is named `check`.
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already ships the Android SDK and its own sdkmanager.
      # setup-android@v3 is not used: it still asks for the removed `tools` package.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-37.2" "build-tools;36.0.0"

      # check runs unit tests, lint, ktlint, Detekt, checkPortability and checkLicences.
      - name: Check
        run: ./gradlew check --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app-android:assembleDebug --no-daemon

      # B14 adds the Wear OS companion as its own APK; it shares :core and is built in
      # CI so a break in the Wear module cannot merge behind a green phone build.
      - name: Assemble the Wear companion
        run: ./gradlew :app-wear:assembleDebug --no-daemon

      # B6 introduced two store flavours (Play and the Play-Services-free F-Droid build);
      # both use the Apache-2.0 ZXing decoder and both must compile.
      - name: Assemble the F-Droid flavour
        run: ./gradlew :app-android:assembleFdroidDebug --no-daemon

      # R8, resource shrinking and the baseline-profile rewrite only run on release; a
      # missing keep rule must fail here, not on the owner's machine. No keystore is
      # present in CI, so these build unsigned.
      - name: Assemble release variants
        run: >-
          ./gradlew :app-android:assemblePlayRelease :app-android:assembleFdroidRelease
          :app-wear:assembleRelease --no-daemon
