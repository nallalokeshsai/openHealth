<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 450 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .device-frame { fill: #000000; stroke: #333; stroke-width: 2; }
      .header-bg { fill: #1C1C1E; }
      .card-bg { fill: #1C1C1E; stroke: #545458; stroke-width: 0.5; }
      .tab-bar { fill: #0E0E10; stroke: #545458; stroke-width: 0.5; }
      .accent { fill: #A3E635; }
      .text-header { font-size: 28px; font-weight: bold; fill: #FFFFFF; font-family: system-ui; }
      .text-label { font-size: 11px; fill: rgba(235,235,245,0.60); font-family: system-ui; }
      .text-body { font-size: 12px; fill: #FFFFFF; font-family: system-ui; }
      .text-value { font-size: 14px; font-weight: bold; fill: #FFFFFF; font-family: system-ui; }
      .text-accent { font-size: 12px; font-weight: bold; fill: #A3E635; font-family: system-ui; }
      .separator { stroke: rgba(84,84,88,0.60); stroke-width: 0.5; }
    </style>
  </defs>

  <rect class="device-frame" x="20" y="20" width="410" height="960" rx="20"/>
  
  <!-- HEADER -->
  <rect class="header-bg" x="20" y="60" width="410" height="52"/>
  <text class="text-header" x="35" y="90">Insights</text>
  <text class="text-label" x="35" y="105">Week of November 18</text>
  <circle fill="#A3E635" cx="410" cy="85" r="12"/>
  <text class="text-body" x="405" y="90" text-anchor="middle">⚙️</text>

  <!-- SEGMENTED CONTROL -->
  <rect class="card-bg" x="30" y="118" width="390" height="44" rx="8" fill="#2C2C2E"/>
  <rect fill="#1C1C1E" x="35" y="123" width="75" height="34" rx="6"/>
  <text class="text-body" x="72.5" y="145" text-anchor="middle" font-size="11">Overview</text>
  
  <text class="text-label" x="130" y="145" text-anchor="middle" font-size="11">Training</text>
  <text class="text-label" x="210" y="145" text-anchor="middle" font-size="11">Sleep</text>
  <text class="text-label" x="280" y="145" text-anchor="middle" font-size="11">Body</text>
  <text class="text-label" x="350" y="145" text-anchor="middle" font-size="11">Food</text>

  <!-- KPI BAND -->
  <g id="kpi-band">
    <rect class="card-bg" x="30" y="170" width="390" height="68" rx="8"/>
    
    <rect fill="#2C2C2E" x="40" y="180" width="115" height="52" rx="6"/>
    <text class="text-label" x="97.5" y="195" text-anchor="middle">Total volume</text>
    <text class="text-value" x="97.5" y="222" text-anchor="middle" font-size="20">24t</text>
    
    <rect fill="#2C2C2E" x="167" y="180" width="115" height="52" rx="6"/>
    <text class="text-label" x="224.5" y="195" text-anchor="middle">Avg effort</text>
    <text class="text-value" x="224.5" y="222" text-anchor="middle" font-size="20">7.2</text>
    
    <rect fill="#2C2C2E" x="294" y="180" width="115" height="52" rx="6"/>
    <text class="text-label" x="351.5" y="195" text-anchor="middle">Sessions</text>
    <text class="text-value" x="351.5" y="222" text-anchor="middle" font-size="20">3</text>
  </g>

  <!-- VOLUME TREND CARD -->
  <rect class="card-bg" x="30" y="254" width="390" height="140" rx="8"/>
  <text class="text-body" x="50" y="274">Volume trend</text>
  <line class="separator" x1="50" y1="284" x2="410" y2="284"/>
  
  <rect fill="#2C2C2E" x="50" y="296" width="390" height="90" rx="4"/>
  <polyline points="60,360 85,350 110,355 135,340 160,352 185,345 210,358 235,342 260,350 285,338 310,348 335,344 360,352 380,346" stroke="#A3E635" stroke-width="2" fill="none"/>
  <text class="text-label" x="225" y="398" text-anchor="middle">Line chart · Last 12 weeks</text>
  
  <text class="text-label" x="50" y="414" font-size="10">How this is calculated ›</text>

  <!-- TRAINING HEATMAP CARD -->
  <rect class="card-bg" x="30" y="410" width="390" height="120" rx="8"/>
  <text class="text-body" x="50" y="430">Training heatmap</text>
  <line class="separator" x1="50" y1="440" x2="410" y2="440"/>
  
  <rect fill="#2C2C2E" x="50" y="452" width="390" height="40" rx="4"/>
  <circle fill="#2C2C2E" cx="65" cy="472" r="6"/>
  <circle fill="rgba(163,230,53,0.4)" cx="81" cy="472" r="6"/>
  <circle fill="#A3E635" cx="97" cy="472" r="6"/>
  <circle fill="rgba(163,230,53,0.4)" cx="113" cy="472" r="6"/>
  <circle fill="#2C2C2E" cx="129" cy="472" r="6"/>
  <circle fill="rgba(163,230,53,0.2)" cx="145" cy="472" r="6"/>
  <circle fill="#2C2C2E" cx="161" cy="472" r="6"/>
  <text class="text-label" x="225" y="502" text-anchor="middle">Heatmap · Last 12 weeks</text>
  
  <text class="text-label" x="50" y="518" font-size="10">How this is calculated ›</text>

  <!-- TOP LIFTS CARD -->
  <rect class="card-bg" x="30" y="546" width="390" height="120" rx="8"/>
  <text class="text-body" x="50" y="566">Top lifts</text>
  <line class="separator" x1="50" y1="576" x2="410" y2="576"/>
  
  <text class="text-body" x="50" y="598">Squat</text>
  <text class="text-value" x="390" y="598" text-anchor="end" font-size="12">150 kg</text>
  <rect fill="#2C2C2E" x="50" y="604" width="340" height="6" rx="3"/>
  <rect class="accent" x="50" y="604" width="255" height="6" rx="3"/>
  
  <text class="text-body" x="50" y="628">Bench Press</text>
  <text class="text-value" x="390" y="628" text-anchor="end" font-size="12">110 kg</text>
  <rect fill="#2C2C2E" x="50" y="634" width="340" height="6" rx="3"/>
  <rect class="accent" x="50" y="634" width="187" height="6" rx="3"/>
  
  <text class="text-body" x="50" y="658">Deadlift</text>
  <text class="text-value" x="390" y="658" text-anchor="end" font-size="12">190 kg</text>
  <rect fill="#2C2C2E" x="50" y="664" width="340" height="6" rx="3"/>
  <rect class="accent" x="50" y="664" width="323" height="6" rx="3"/>
  
  <text class="text-label" x="50" y="680" font-size="10">How this is calculated ›</text>

  <!-- TAB BAR -->
  <rect class="tab-bar" x="20" y="900" width="410" height="80"/>
  <line class="separator" x1="20" y1="900" x2="430" y2="900"/>
  
  <text class="text-label" x="60" y="925" text-anchor="middle">📅</text>
  <text class="text-label" x="60" y="945" text-anchor="middle" font-size="10">Today</text>
  
  <text class="text-label" x="130" y="925" text-anchor="middle">🏋️</text>
  <text class="text-label" x="130" y="945" text-anchor="middle" font-size="10">Train</text>
  
  <text class="text-label" x="200" y="925" text-anchor="middle">🍽️</text>
  <text class="text-label" x="200" y="945" text-anchor="middle" font-size="10">Food</text>
  
  <text class="text-label" x="270" y="925" text-anchor="middle">👤</text>
  <text class="text-label" x="270" y="945" text-anchor="middle" font-size="10">Body</text>
  
  <text class="text-accent" x="340" y="925" text-anchor="middle">📊</text>
  <text class="text-accent" x="340" y="945" text-anchor="middle" font-size="10">Insights</text>
  
  <text class="text-label" x="410" y="925" text-anchor="middle">⋯</text>
  <text class="text-label" x="410" y="945" text-anchor="middle" font-size="10">More</text>

  <rect x="20" y="980" width="410" height="20" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
</svg>