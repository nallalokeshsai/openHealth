<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 450 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .device-frame { fill: #000000; stroke: #333; stroke-width: 2; }
      .header-bg { fill: #1C1C1E; }
      .card-bg { fill: #1C1C1E; stroke: #545458; stroke-width: 0.5; }
      .tab-bar { fill: #0E0E10; stroke: #545458; stroke-width: 0.5; }
      .accent { fill: #A3E635; }
      .text-header { font-size: 28px; font-weight: bold; fill: #FFFFFF; font-family: system-ui; }
      .text-label { font-size: 11px; fill: rgba(235,235,245,0.60); font-family: system-ui; }
      .text-body { font-size: 12px; fill: #FFFFFF; font-family: system-ui; }
      .text-value { font-size: 14px; font-weight: bold; fill: #FFFFFF; font-family: system-ui; }
      .text-accent { font-size: 12px; font-weight: bold; fill: #A3E635; font-family: system-ui; }
      .separator { stroke: rgba(84,84,88,0.60); stroke-width: 0.5; }
      .annotation { font-size: 9px; fill: #999; font-family: monospace; }
      .dimension-line { stroke: #666; stroke-width: 1; stroke-dasharray: 2,2; }
    </style>
  </defs>

  <!-- Device Frame -->
  <rect class="device-frame" x="20" y="20" width="410" height="960" rx="20"/>
  
  <!-- HEADER -->
  <rect class="header-bg" x="20" y="60" width="410" height="52"/>
  <text class="text-header" x="35" y="90">Training</text>
  <text class="text-label" x="35" y="105">Week of November 18</text>
  <circle fill="#A3E635" cx="410" cy="85" r="12"/>
  <text class="text-body" x="405" y="90" text-anchor="middle">⚙️</text>

  <!-- WEEK STRIP CARD -->
  <rect class="card-bg" x="30" y="118" width="390" height="68" rx="8"/>
  <text class="text-body" x="50" y="138">This week</text>
  <text class="text-label" x="390" y="138" text-anchor="end">3 ⚫</text>
  <line class="separator" x1="50" y1="148" x2="410" y2="148"/>
  
  <!-- 7 Day Bubbles -->
  <g id="week-strip">
    <rect fill="#2C2C2E" x="50" y="158" width="32" height="40" rx="4"/>
    <text class="text-label" x="66" y="168" text-anchor="middle">Mon</text>
    <text class="text-body" x="66" y="188" text-anchor="middle">18</text>
    
    <rect fill="#2C2C2E" x="90" y="158" width="32" height="40" rx="4"/>
    <text class="text-label" x="106" y="168" text-anchor="middle">Tue</text>
    <text class="text-body" x="106" y="188" text-anchor="middle">19</text>
    
    <rect fill="#2C2C2E" x="130" y="158" width="32" height="40" rx="4"/>
    <text class="text-label" x="146" y="168" text-anchor="middle">Wed</text>
    <text class="text-body" x="146" y="188" text-anchor="middle">20</text>
    
    <rect class="accent" x="170" y="158" width="32" height="40" rx="4"/>
    <text class="text-body" x="186" y="168" text-anchor="middle">Thu</text>
    <text class="text-body" x="186" y="188" text-anchor="middle">21</text>
    
    <rect fill="#2C2C2E" x="210" y="158" width="32" height="40" rx="4"/>
    <text class="text-label" x="226" y="168" text-anchor="middle">Fri</text>
    <text class="text-body" x="226" y="188" text-anchor="middle">22</text>
    
    <rect fill="#2C2C2E" x="250" y="158" width="32" height="40" rx="4"/>
    <text class="text-label" x="266" y="168" text-anchor="middle">Sat</text>
    <text class="text-body" x="266" y="188" text-anchor="middle">23</text>
    
    <rect fill="#2C2C2E" x="290" y="158" width="32" height="40" rx="4"/>
    <text class="text-label" x="306" y="168" text-anchor="middle">Sun</text>
    <text class="text-body" x="306" y="188" text-anchor="middle">24</text>
  </g>

  <!-- TODAY'S PLAN CARD -->
  <rect class="card-bg" x="30" y="202" width="390" height="68" rx="8"/>
  <text class="text-body" x="50" y="222">Today's plan</text>
  <line class="separator" x1="50" y1="232" x2="410" y2="232"/>
  
  <circle fill="rgba(163,230,53,0.16)" cx="50" cy="254" r="23"/>
  <text class="text-body" x="50" y="259" text-anchor="middle">🦵</text>
  <text class="text-body" x="80" y="254">Lower Power</text>
  <text class="text-label" x="80" y="269">Squats, Deadlifts, Leg Press</text>
  <text class="text-body" x="405" y="254" text-anchor="middle">›</text>

  <!-- ACTIVE PROGRAMMES CARD -->
  <rect class="card-bg" x="30" y="286" width="390" height="88" rx="8"/>
  <text class="text-body" x="50" y="306">Active programmes</text>
  <line class="separator" x="50" y="316" x2="410" y2="316"/>
  
  <!-- Programme 1 -->
  <text class="text-body" x="50" y="338">Push/Pull/Legs</text>
  <text class="text-label" x="390" y="338" text-anchor="end">Week 4 of 12</text>
  <text class="text-body" x="405" y="338" text-anchor="end">›</text>
  <line class="separator" x1="50" y1="346" x2="410" y2="346"/>
  
  <!-- Programme 2 -->
  <text class="text-body" x="50" y="368">Upper/Lower</text>
  <text class="text-label" x="390" y="368" text-anchor="end">Week 2 of 8</text>
  <text class="text-body" x="405" y="368" text-anchor="end">›</text>

  <!-- RECENT WORKOUTS CARD -->
  <rect class="card-bg" x="30" y="390" width="390" height="120" rx="8"/>
  <text class="text-body" x="50" y="410">Recent workouts</text>
  <line class="separator" x1="50" y1="420" x2="410" y2="420"/>
  
  <!-- Workout 1 -->
  <rect fill="#2C2C2E" x="50" y="430" width="50" height="50" rx="4"/>
  <text class="text-body" x="75" y="460" text-anchor="middle">🏋️</text>
  <text class="text-body" x="110" y="445">Upper Power</text>
  <text class="text-label" x="110" y="460">Wed · 55 min</text>
  <text class="text-accent" x="390" y="460" text-anchor="end">8 sets</text>
  
  <line class="separator" x1="50" y1="488" x2="410" y2="488"/>
  
  <!-- Workout 2 -->
  <rect fill="#2C2C2E" x="50" y="498" width="50" height="50" rx="4"/>
  <text class="text-body" x="75" y="528" text-anchor="middle">🏋️</text>
  <text class="text-body" x="110" y="513">Lower Hypertrophy</text>
  <text class="text-label" x="110" y="528">Mon · 48 min</text>
  <text class="text-accent" x="390" y="528" text-anchor="end">12 sets</text>

  <!-- THIS MONTH STATS CARD -->
  <rect class="card-bg" x="30" y="526" width="390" height="120" rx="8"/>
  <text class="text-body" x="50" y="546">This month</text>
  <line class="separator" x1="50" y1="556" x2="410" y2="556"/>
  
  <!-- 2x2 Grid -->
  <rect fill="#2C2C2E" x="50" y="568" width="85" height="70" rx="8"/>
  <text class="text-label" x="92.5" y="583" text-anchor="middle">Total sessions</text>
  <text class="text-value" x="92.5" y="610" text-anchor="middle" font-size="20">12</text>
  
  <rect fill="#2C2C2E" x="145" y="568" width="85" height="70" rx="8"/>
  <text class="text-label" x="187.5" y="583" text-anchor="middle">Total volume</text>
  <text class="text-value" x="187.5" y="610" text-anchor="middle" font-size="20">24t</text>
  
  <rect fill="#2C2C2E" x="240" y="568" width="85" height="70" rx="8"/>
  <text class="text-label" x="282.5" y="583" text-anchor="middle">Avg duration</text>
  <text class="text-value" x="282.5" y="610" text-anchor="middle" font-size="20">52m</text>
  
  <rect fill="#2C2C2E" x="335" y="568" width="85" height="70" rx="8"/>
  <text class="text-label" x="377.5" y="583" text-anchor="middle">Avg effort</text>
  <text class="text-value" x="377.5" y="610" text-anchor="middle" font-size="20">7.2</text>

  <!-- TAB BAR -->
  <rect class="tab-bar" x="20" y="900" width="410" height="80"/>
  <line class="separator" x1="20" y1="900" x2="430" y2="900"/>
  
  <text class="text-label" x="60" y="925" text-anchor="middle">📅</text>
  <text class="text-label" x="60" y="945" text-anchor="middle" font-size="10">Today</text>
  
  <text class="text-accent" x="130" y="925" text-anchor="middle">🏋️</text>
  <text class="text-accent" x="130" y="945" text-anchor="middle" font-size="10">Train</text>
  
  <text class="text-label" x="200" y="925" text-anchor="middle">🍽️</text>
  <text class="text-label" x="200" y="945" text-anchor="middle" font-size="10">Food</text>
  
  <text class="text-label" x="270" y="925" text-anchor="middle">👤</text>
  <text class="text-label" x="270" y="945" text-anchor="middle" font-size="10">Body</text>
  
  <text class="text-label" x="340" y="925" text-anchor="middle">📊</text>
  <text class="text-label" x="340" y="945" text-anchor="middle" font-size="10">Insights</text>
  
  <text class="text-label" x="410" y="925" text-anchor="middle">⋯</text>
  <text class="text-label" x="410" y="945" text-anchor="middle" font-size="10">More</text>

  <!-- Bottom Safe Area -->
  <rect x="20" y="980" width="410" height="20" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
</svg>