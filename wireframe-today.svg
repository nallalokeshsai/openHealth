<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 450 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .device-frame { fill: #000000; stroke: #333; stroke-width: 2; }
      .header-bg { fill: #1C1C1E; }
      .card-bg { fill: #1C1C1E; stroke: #545458; stroke-width: 0.5; }
      .tab-bar { fill: #0E0E10; stroke: #545458; stroke-width: 0.5; }
      .accent { fill: #A3E635; }
      .accent-soft { fill: #A3E635; opacity: 0.16; }
      .text-header { font-size: 28px; font-weight: bold; fill: #FFFFFF; font-family: system-ui; }
      .text-label { font-size: 11px; fill: rgba(235,235,245,0.60); font-family: system-ui; }
      .text-body { font-size: 12px; fill: #FFFFFF; font-family: system-ui; }
      .text-value { font-size: 14px; font-weight: bold; fill: #FFFFFF; font-family: system-ui; }
      .text-accent { font-size: 12px; font-weight: bold; fill: #A3E635; font-family: system-ui; }
      .separator { stroke: rgba(84,84,88,0.60); stroke-width: 0.5; }
      .annotation { font-size: 9px; fill: #999; font-family: monospace; }
      .dimension-line { stroke: #666; stroke-width: 1; stroke-dasharray: 2,2; }
      .dimension-text { font-size: 8px; fill: #888; font-family: monospace; }
    </style>
  </defs>

  <!-- Device Frame -->
  <rect class="device-frame" x="20" y="20" width="410" height="960" rx="20"/>
  
  <!-- Safe Area Indicator -->
  <rect x="20" y="20" width="410" height="40" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
  <text class="annotation" x="25" y="30">24dp safe area (status bar)</text>

  <!-- HEADER SECTION (24-68dp) -->
  <rect class="header-bg" x="20" y="60" width="410" height="52"/>
  <text class="text-header" x="35" y="90">Good morning</text>
  <text class="text-label" x="35" y="105">Saturday 21 November · 08:14</text>
  <circle fill="#A3E635" cx="410" cy="85" r="12"/>
  <text class="text-body" x="405" y="90" text-anchor="middle">⚙️</text>
  
  <line class="dimension-line" x1="15" y1="60" x2="15" y2="112"/>
  <text class="dimension-text" x="8" y="88">52dp</text>

  <!-- CONNECTION BANNER (68-116dp) -->
  <rect class="card-bg" x="30" y="118" width="390" height="52" rx="8" fill="rgba(255,149,0,0.1)" stroke="rgba(255,149,0,0.3)"/>
  <text class="text-body" x="50" y="138">⚠️  Syncing paused</text>
  <text class="text-label" x="50" y="155">Enable location or check connection</text>
  <circle fill="none" stroke="#888" stroke-width="1" cx="400" cy="142" r="8"/>
  <text class="text-body" x="400" y="147" text-anchor="middle">×</text>

  <!-- READINESS CARD (120-184dp) -->
  <rect class="card-bg" x="30" y="180" width="390" height="68" rx="8"/>
  <text class="text-body" x="50" y="200">🌙 Readiness</text>
  <text class="text-value" x="385" y="200" text-anchor="end">72%</text>
  <line class="separator" x1="50" y1="210" x2="410" y2="210"/>
  
  <!-- Chips -->
  <rect fill="rgba(163,230,53,0.2)" x="50" y="220" width="90" height="24" rx="12"/>
  <text class="text-body" x="95" y="237" text-anchor="middle">Sleep: 7h 32m</text>
  
  <rect fill="#2C2C2E" stroke="#545458" stroke-width="0.5" x="150" y="220" width="80" height="24" rx="12"/>
  <text class="text-body" x="190" y="237" text-anchor="middle">HRV: 48 ms</text>
  
  <rect fill="#2C2C2E" stroke="#545458" stroke-width="0.5" x="240" y="220" width="70" height="24" rx="12"/>
  <text class="text-body" x="275" y="237" text-anchor="middle">RHR: 52</text>
  
  <text class="text-label" x="50" y="258">You're ready for a hard session today.</text>

  <!-- WEEK STRIP CARD (192-324dp) -->
  <rect class="card-bg" x="30" y="264" width="390" height="68" rx="8"/>
  <text class="text-body" x="50" y="284">This week</text>
  <text class="text-label" x="385" y="284" text-anchor="end">3 ⚫</text>
  <line class="separator" x1="50" y1="294" x2="410" y2="294"/>
  
  <!-- 7 Day Bubbles -->
  <g id="week-strip">
    <rect fill="#2C2C2E" x="50" y="308" width="32" height="40" rx="4"/>
    <text class="text-label" x="66" y="318" text-anchor="middle">Mon</text>
    <text class="text-body" x="66" y="338" text-anchor="middle">18</text>
    
    <rect fill="#2C2C2E" x="90" y="308" width="32" height="40" rx="4"/>
    <text class="text-label" x="106" y="318" text-anchor="middle">Tue</text>
    <text class="text-body" x="106" y="338" text-anchor="middle">19</text>
    
    <rect fill="#2C2C2E" x="130" y="308" width="32" height="40" rx="4"/>
    <text class="text-label" x="146" y="318" text-anchor="middle">Wed</text>
    <text class="text-body" x="146" y="338" text-anchor="middle">20</text>
    
    <rect class="accent" x="170" y="308" width="32" height="40" rx="4"/>
    <text class="text-body" x="186" y="318" text-anchor="middle">Thu</text>
    <text class="text-body" x="186" y="338" text-anchor="middle">21</text>
    
    <rect fill="#2C2C2E" x="210" y="308" width="32" height="40" rx="4"/>
    <text class="text-label" x="226" y="318" text-anchor="middle">Fri</text>
    <text class="text-body" x="226" y="338" text-anchor="middle">22</text>
    
    <rect fill="#2C2C2E" x="250" y="308" width="32" height="40" rx="4"/>
    <text class="text-label" x="266" y="318" text-anchor="middle">Sat</text>
    <text class="text-body" x="266" y="338" text-anchor="middle">23</text>
    
    <rect fill="#2C2C2E" x="290" y="308" width="32" height="40" rx="4"/>
    <text class="text-label" x="306" y="318" text-anchor="middle">Sun</text>
    <text class="text-body" x="306" y="338" text-anchor="middle">24</text>
  </g>

  <!-- PLAN ROW -->
  <rect class="card-bg" x="30" y="364" width="390" height="52" rx="8" fill="#2C2C2E"/>
  <circle class="accent-soft" cx="50" cy="390" r="23"/>
  <text class="text-body" x="50" y="395" text-anchor="middle">💪</text>
  <text class="text-body" x="80" y="390">Upper Power</text>
  <text class="text-label" x="80" y="405">Today · 50 min</text>
  <rect class="accent" x="340" y="376" width="70" height="32" rx="6"/>
  <text class="text-body" x="375" y="397" text-anchor="middle" fill="#0C0E12">Start</text>

  <!-- NUTRITION CARD (428-588dp) -->
  <rect class="card-bg" x="30" y="432" width="390" height="156" rx="8"/>
  <text class="text-body" x="50" y="452">🔥 Nutrition</text>
  
  <!-- Ring visualization -->
  <circle cx="225" cy="490" r="40" fill="none" stroke="#2C2C2E" stroke-width="6"/>
  <circle cx="225" cy="490" r="40" fill="none" stroke="#A3E635" stroke-width="6" stroke-dasharray="62.83 251.33" stroke-linecap="round"/>
  <text class="text-value" x="225" y="495" text-anchor="middle">1240</text>
  <text class="text-label" x="225" y="508" text-anchor="middle">/ 2200</text>
  
  <!-- Macro bars -->
  <text class="text-label" x="50" y="535">Protein</text>
  <text class="text-label" x="390" y="535" text-anchor="end">120g / 160g</text>
  <rect fill="#2C2C2E" x="50" y="542" width="390" height="4" rx="2"/>
  <rect class="accent" x="50" y="542" width="292" height="4" rx="2"/>

  <text class="text-label" x="50" y="565">Carbs</text>
  <text class="text-label" x="390" y="565" text-anchor="end">240g / 300g</text>
  <rect fill="#2C2C2E" x="50" y="572" width="390" height="4" rx="2"/>
  <rect class="accent" x="50" y="572" width="312" height="4" rx="2"/>

  <!-- TAB BAR (900-960dp) -->
  <rect class="tab-bar" x="20" y="900" width="410" height="80"/>
  <line class="separator" x1="20" y1="900" x2="430" y2="900"/>
  
  <!-- Tab items -->
  <text class="text-accent" x="60" y="925" text-anchor="middle">📅</text>
  <text class="text-accent" x="60" y="945" text-anchor="middle" font-size="10">Today</text>
  
  <text class="text-label" x="130" y="925" text-anchor="middle">🏋️</text>
  <text class="text-label" x="130" y="945" text-anchor="middle" font-size="10">Train</text>
  
  <text class="text-label" x="200" y="925" text-anchor="middle">🍽️</text>
  <text class="text-label" x="200" y="945" text-anchor="middle" font-size="10">Food</text>
  
  <text class="text-label" x="270" y="925" text-anchor="middle">👤</text>
  <text class="text-label" x="270" y="945" text-anchor="middle" font-size="10">Body</text>
  
  <text class="text-label" x="340" y="925" text-anchor="middle">📊</text>
  <text class="text-label" x="340" y="945" text-anchor="middle" font-size="10">Insights</text>
  
  <text class="text-label" x="410" y="925" text-anchor="middle">⋯</text>
  <text class="text-label" x="410" y="945" text-anchor="middle" font-size="10">More</text>

  <!-- Bottom Safe Area -->
  <rect x="20" y="980" width="410" height="20" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
  <text class="annotation" x="25" y="995">12dp device safe area</text>

  <!-- Annotations -->
  <text class="annotation" x="435" y="80">Header: 34sp / 700</text>
  <text class="annotation" x="435" y="95">Subtitle: 13sp</text>
  <text class="annotation" x="435" y="175">Card padding: 16dp</text>
  <text class="annotation" x="435" y="275">Chips: 8dp gap</text>
  <text class="annotation" x="435" y="470">Ring: 120dp</text>
  <text class="annotation" x="435" y="600">Bar height: 4dp</text>
  <text class="annotation" x="435" y="920">Tab bar: 60dp</text>
</svg>