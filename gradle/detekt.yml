# Detekt overrides for openHealth, layered on detekt's default configuration.
#
# Two kinds of code are declarative tables rather than logic, and are scoped here the
# same way `@Composable` is scoped below: repositories (one function per query, by
# design) and the fixture corpus (its numbers are the sample data). The rules stay on
# everywhere else, including all screens, formulas and the rollup engine.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
    excludes: ['**/corpus/**', '**/src/test/**', '**/tools/fixtures/**']
  LongParameterList:
    ignoreAnnotated: ['Composable']
    excludes: ['**/corpus/**', '**/src/test/**', '**/tools/fixtures/**']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    excludes: ['**/repo/**', '**/corpus/**', '**/rollup/**', '**/test/**', '**/androidTest/**']

style:
  MagicNumber:
    excludes: ['**/corpus/**', '**/tools/fixtures/**', '**/src/test/**']
