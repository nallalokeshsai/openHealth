org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Sequential tasks: the five-year query benchmark in :tools:fixtures measures wall-clock
# time, and a shared CI runner running it beside compilation and lint inflated the same
# query from 2 ms locally to 18.6 ms. The benchmark is part of `check`, so the build keeps
# parallel compilation off rather than weakening the 16 ms budget (`Tech-Stack.md` §12).
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true

kotlin.code.style=official
